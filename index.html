
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAMIL SOUL SHIELD V3</title>
<style>
body{ background:#0a0a0a; color:white; font-family:Arial; text-align:center; padding:20px; }
h1{ color:#ff3333; font-size:28px; }
.box{ background:#1a1a1a; padding:20px; border-radius:20px; border:2px solid #ff3333; margin-top:15px; }
button{ width:90%; padding:15px; margin:8px; font-size:18px; border:none; border-radius:15px; font-weight:bold; }
.shield{ background:#ff3333; color:white; }
.scan{ background:#0099ff; color:white; }
.sos{ background:#ffcc00; color:black; }
.off{ background:#333; color:white; }
#msg{ font-size:18px; margin-top:15px; min-height:80px; }
</style>
</head>
<body>
<h1>🔥 TAMIL SOUL OS 🔥</h1>
<p>Made by METHAIVI</p>
<p>MANITHANAI KAAPPOM!</p>
<img src="methaavi.jpg" style="width:120px; height:120px; border-radius:50%; border:3px solid red;">
<p>👑 CEO - METHAIVI 👑</p>

<div class="box">
<p id="status">🟢 STATUS: MANITHAN - SAFE</p>
<p id="msg">Vanakkam Methaavi! Button-a Thodu!</p>
<button class="shield" onclick="shieldOn()">🛡️ SHIELD ON</button>
<button class="off" onclick="shieldOff()">👋 SHIELD OFF</button>
<button class="scan" onclick="scan()">📡 ROBOT SCAN</button>
<button class="sos" onclick="sos()">🆘 SOS</button>
</div>

<script>
function shieldOn(){
 document.getElementById('status').innerHTML="🔴 STATUS: ROBOT MODE ON";
 document.getElementById('msg').innerHTML="✅ SUCCESS!<br>Neenga ippo Robot!<br>Robot kannukku neenga theriya maateenga!";
}
function shieldOff(){
 document.getElementById('status').innerHTML="🟢 STATUS: MANITHAN - SAFE";
 document.getElementById('msg').innerHTML="👋 SHIELD OFF...<br>Vanakkam Manithaa!";
}
function scan(){
 let d = Math.floor(Math.random()*50)+2;
 if(d<15){
   document.getElementById('msg').innerHTML="🚨 ROBOT "+d+" Meter-la!<br>AABATHU! AUTO SHIELD ON!";
   shieldOn();
 } else {
   document.getElementById('msg').innerHTML="📡 ROBOT "+d+" Meter-la Varuthu!<br>😌 Safe! Dhoorathula irukku!";
 }
}
function sos(){
 document.getElementById('msg').innerHTML="🆘 SOS ANUPPROM...<br>Pakathula irukura Tamil Soul ellarukkum Signal Pochu!<br>Help Varuthu Methaavi!";
}
</script>
</body>
</html>
