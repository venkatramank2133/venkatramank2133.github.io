
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMIL SOUL OS - MANITHANAI KAAPPOM!</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
h1{color:#ff2d55}
.box{border:2px solid #ff2d55;border-radius:15px;padding:15px;margin:10px}
button{padding:15px 20px;margin:5px;font-size:18px;border:none;border-radius:10px;font-weight:bold}
.green{background:#00e676}.red{background:#ff2d55;color:#fff}.blue{background:#2979ff;color:#fff}.orange{background:#ff9100}
</style>
</head>
<body>
<h1>🔥 TAMIL SOUL OS 🔥</h1>
<h3>MANITHANAI KAAPPOM!</h3>
<p id="status">👤 STATUS: MANITHAN - SAFE</p>

<div class="box">
<h3>1. Walkie Talkie - PMR446</h3>
<button class="green" onclick="talk()">🎙️ PRESS TO TALK</button>
<p id="walkie">Ready...</p>
</div>

<div class="box">
<h3>2. GPS - Offline Location</h3>
<button class="blue" onclick="gps()">📍 GET MY LOCATION</button>
<p id="gps">Location: Not Yet</p>
</div>

<div class="box">
<h3>3. Mesh Chain</h3>
<button class="blue" onclick="mesh()">🔗 CHECK MESH</button>
<p id="mesh">Mesh: Checking...</p>
</div>

<div class="box">
<h3>4. ROBOT MODE + SHIELD</h3>
<button class="red" onclick="shieldOn()">🛡️ SHIELD ON</button>
<button onclick="shieldOff()">🛑 SHIELD OFF</button>
<p id="shield">Shield: OFF</p>
</div>

<div class="box">
<h3>5. SOS - Emergency</h3>
<button class="orange" onclick="sos()">🆘 SOS - SEND HELP</button>
<p id="sos"></p>
</div>

<p>Total Size - Only 10 MB! Light = Fast!</p>

<script>
function talk(){document.getElementById('walkie').innerText="🎙️ Talking... PMR446 Channel 8 - Voice Going!"; setTimeout(()=>{document.getElementById('walkie').innerText="✅ Voice Sent via Mesh!";},1500);}
function gps(){navigator.geolocation.getCurrentPosition(p=>{document.getElementById('gps').innerText="📍 Lat: "+p.coords.latitude.toFixed(4)+" Lon: "+p.coords.longitude.toFixed(4);},()=>{document.getElementById('gps').innerText="GPS: Please Allow Location";});}
function mesh(){document.getElementById('mesh').innerText="🔗 Mesh ON! 3 Phones Found Nearby! You are now a Tower!";}
function shieldOn(){document.getElementById('shield').innerText="🛡️ SHIELD ON! No Tracking, No Server! You are Safe!"; document.getElementById('status').innerText="🤖 STATUS: ROBOT MODE ON - Invisible!";}
function shieldOff(){document.getElementById('shield').innerText="Shield: OFF"; document.getElementById('status').innerText="👤 STATUS: MANITHAN - SAFE";}
function sos(){document.getElementById('sos').innerText="🆘 SOS SENT! Help is Coming! Location Shared to Nearby Drivers!";}
</script>
  <script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
  </html>
